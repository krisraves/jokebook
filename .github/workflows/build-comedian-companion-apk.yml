name: Build Comedian Companion APK

on:
  push:
    branches:
      - chatgpt/comedian-companion-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chatgpt-build/work
          base64 -d chatgpt-build/payload.b64 > /tmp/comedian-companion-src.zip
          unzip -q /tmp/comedian-companion-src.zip -d chatgpt-build/work
          test -f chatgpt-build/work/settings.gradle.kts
          test -f chatgpt-build/work/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6'

      - name: Build debug APK
        working-directory: chatgpt-build/work
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Copy installable APK
        shell: bash
        run: |
          mkdir -p dist
          cp chatgpt-build/work/app/build/outputs/apk/debug/app-debug.apk dist/comedian-companion-debug.apk
          sha256sum dist/comedian-companion-debug.apk | tee dist/comedian-companion-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: comedian-companion-android-apk
          path: |
            dist/comedian-companion-debug.apk
            dist/comedian-companion-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
